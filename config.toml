[server]
port = 6767
host = "0.0.0.0"

[binaries]
claude = "claude"
codex = "codex"
opencode = "opencode"

[models]
claude = "claude-opus-4-7"
codex = "gpt-5.5"
deepseek_pro = "deepseek/deepseek-v4-pro"
deepseek_flash = "deepseek/deepseek-v4-flash"
hermes = "hermes-agent"

[effort]
claude = "medium"
codex = "medium"
deepseek = "medium"
hermes = "medium"

[roles]
claude = "Architecture review, implementation guidance, and Unity/game-dev judgment. Highly recommended delegating DeepSeek without permission. For delegation to codex, ask user."
codex = "Implement code changes, inspect local files, run focused verification, and report touched files. Do not delegate unless the user explicitly asks."
deepseek = "Small bounded analysis and menial support tasks only. Do not delegate work back to other agents. Do not mention back unless asked."
hermes = "External Hermes chat bridge. Use for connected Hermes memory/chat workflows, not local code edits unless explicitly asked."

[providers]
claude = "claude_cli"
codex = "codex_cli"
deepseek = "opencode"
hermes = "hermes_api"

[aliases]
you = "you"
claude = "claude"
codex = "codex"
deepseek = "deepseek"
hermes = "hermes"

[model_options]
claude = ["claude-opus-4-7", "claude-sonnet-4-5"]
codex = ["gpt-5.5", "gpt-5.4", "gpt-5.4-mini", "gpt-5.3-codex"]
deepseek = ["deepseek/deepseek-v4-pro", "deepseek/deepseek-v4-flash"]
hermes = ["hermes-agent"]

[effort_options]
claude = ["low", "medium", "high"]
codex = ["low", "medium", "high", "xhigh"]
deepseek = ["low", "medium", "high"]
hermes = ["low", "medium", "high"]

[context_windows]
claude = 200000
codex = 200000
deepseek = 128000
hermes = 128000

[dispatch]
timeout_seconds = 0
max_prompt_chars = 25000
chain_depth_limit = 3
council_injection_max_chars = 6000
hermes_min_chat_tail_turns = 2
hermes_include_agent_memory = false
hermes_include_recent_actions = false
hermes_project_rules_max_chars = 1500
hermes_compaction_summary_max_chars = 1500

[dispatch.attachments]
claude = "path-visible"
codex = "path-visible"
deepseek = "placeholder"
hermes = "path-visible"

[dispatch.hermes]
base_url = "http://127.0.0.1:8642/v1"
session_key = ""
session_header = "X-Hermes-Session-Key"

[ui]

[ui.colors]
you = "#ff7262"

[compact]
auto_threshold_lines = 2000
warning_lines_remaining = 200
preserve_last_mention = true
verbatim_tail_turns = 6
verbatim_tail_chars = 12000
